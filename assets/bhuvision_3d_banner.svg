<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="earthGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#1E3A8A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="earthSphere" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="40%" stop-color="#0F2557"/>
      <stop offset="80%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="atmosHalo" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#38BDF8" stop-opacity="0.0"/>
      <stop offset="94%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cyanFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes orbitA { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes orbitB { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
    @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.6); opacity: 0.3; } }
    @keyframes dash { to { stroke-dashoffset: -100; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @keyframes atmosBreathe { 0%, 100% { opacity: 0.8; transform: scale(1); } 50% { opacity: 1; transform: scale(1.02); } }
    @keyframes floatBanner { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }

    .orbit-1 { transform-origin: 920px 240px; transform-box: view-box; animation: orbitA 24s linear infinite; will-change: transform; }
    .orbit-2 { transform-origin: 920px 240px; transform-box: view-box; animation: orbitB 36s linear infinite; will-change: transform; }
    .radar-sweep { transform-origin: 920px 240px; transform-box: view-box; animation: sweep 6s linear infinite; will-change: transform; }
    .beacon-pulse { transform-origin: center; animation: pulse 2s ease-in-out infinite; }
    .dash-line { stroke-dasharray: 6, 6; animation: dash 3s linear infinite; }
    .blink-dot { animation: blink 1.5s ease-in-out infinite; }
    .atmos-anim { transform-origin: 920px 240px; transform-box: view-box; animation: atmosBreathe 4s ease-in-out infinite; }
    .float-ui { animation: floatBanner 5s ease-in-out infinite; }
    .code-font { font-family: 'JetBrains Mono', monospace, Courier; }
    .heading-font { font-family: 'Space Grotesk', -apple-system, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bgGrad)"/>

  <!-- Tactical Grid -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="0.6">
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/><line x1="120" y1="0" x2="120" y2="480"/>
    <line x1="240" y1="0" x2="240" y2="480"/><line x1="360" y1="0" x2="360" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/><line x1="600" y1="0" x2="600" y2="480"/>
    <line x1="720" y1="0" x2="720" y2="480"/><line x1="840" y1="0" x2="840" y2="480"/>
    <line x1="960" y1="0" x2="960" y2="480"/><line x1="1080" y1="0" x2="1080" y2="480"/>
  </g>

  <!-- Starfield -->
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="140" cy="70" r="1"/><circle cx="280" cy="50" r="1.5"/>
    <circle cx="420" cy="110" r="0.8"/><circle cx="630" cy="60" r="1.2"/>
    <circle cx="750" cy="130" r="1.4"/><circle cx="1110" cy="90" r="1"/>
    <circle cx="1150" cy="350" r="1.2"/><circle cx="180" cy="410" r="1"/>
    <circle cx="520" cy="440" r="1.5"/>
  </g>

  <!-- 3D Earth System -->
  <g id="earth-graphics">
    <circle cx="920" cy="240" r="190" fill="url(#earthGlow)"/>

    <!-- Orbit 1: RISAT-1B C-SAR -->
    <g class="orbit-1">
      <ellipse cx="920" cy="240" rx="220" ry="78" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.6" class="dash-line" transform="rotate(-25 920 240)"/>
      <g transform="translate(1120, 210)">
        <rect x="-8" y="-5" width="16" height="10" rx="2" fill="#E2E8F0" stroke="#A855F7" stroke-width="1.5"/>
        <rect x="-22" y="-3" width="12" height="6" rx="1" fill="#3B82F6"/>
        <rect x="10" y="-3" width="12" height="6" rx="1" fill="#3B82F6"/>
        <circle cx="0" cy="0" r="4" fill="#C084FC" filter="url(#glow)"/>
      </g>
    </g>

    <!-- Orbit 2: Cartosat-3 Optical -->
    <g class="orbit-2">
      <ellipse cx="920" cy="240" rx="205" ry="70" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.7" class="dash-line" transform="rotate(35 920 240)"/>
      <g transform="translate(740, 265)">
        <rect x="-7" y="-4" width="14" height="8" rx="2" fill="#F8FAFC" stroke="#06B6D4" stroke-width="1.5"/>
        <rect x="-18" y="-2.5" width="9" height="5" rx="1" fill="#0284C7"/>
        <rect x="9" y="-2.5" width="9" height="5" rx="1" fill="#0284C7"/>
        <circle cx="0" cy="0" r="3.5" fill="#22D3EE" filter="url(#glow)"/>
      </g>
    </g>

    <!-- 3D Solid Planet Sphere -->
    <circle cx="920" cy="240" r="150" fill="url(#earthSphere)"/>

    <!-- India Subcontinent Vector Highlight -->
    <g transform="translate(920, 240) scale(1.15)" filter="url(#glow)">
      <path d="M -15,-40 C 5,-45 25,-35 45,-25 C 55,-10 40,15 30,35 C 20,55 5,75 -5,80 C -15,75 -25,45 -30,25 C -40,5 -35,-25 -15,-40 Z"
            fill="#14532D" fill-opacity="0.35" stroke="#22C55E" stroke-width="1.5"/>
      <path d="M -10,0 L 25,10 L 15,65 L -5,75 L -15,40 Z"
            fill="#064E3B" fill-opacity="0.55" stroke="#06B6D4" stroke-width="2.2"/>
    </g>

    <!-- ISRO Telemetry Beacons -->
    <g transform="translate(935, 290)">
      <circle cx="0" cy="0" r="7" fill="#06B6D4" opacity="0.35" class="beacon-pulse"/>
      <circle cx="0" cy="0" r="3.5" fill="#22D3EE" filter="url(#glow)"/>
      <text x="8" y="3" fill="#A5F3FC" font-size="8" font-weight="bold" class="code-font">ISTRAC [BLR]</text>
    </g>
    <g transform="translate(952, 298)">
      <circle cx="0" cy="0" r="6" fill="#F59E0B" opacity="0.4" class="beacon-pulse"/>
      <circle cx="0" cy="0" r="3" fill="#FBBF24" filter="url(#glow)"/>
      <text x="8" y="3" fill="#FDE68A" font-size="7.5" font-weight="bold" class="code-font">SHAR</text>
    </g>
    <g transform="translate(905, 255)">
      <circle cx="0" cy="0" r="6" fill="#3B82F6" opacity="0.35" class="beacon-pulse"/>
      <circle cx="0" cy="0" r="3" fill="#60A5FA"/>
      <text x="-45" y="3" fill="#BFDBFE" font-size="7.5" font-weight="bold" class="code-font">SAC [AHM]</text>
    </g>

    <circle cx="920" cy="240" r="150" fill="url(#atmosHalo)" class="atmos-anim"/>

    <!-- Radar Sweep -->
    <g class="radar-sweep">
      <path d="M 920,240 L 920,90 A 150,150 0 0,1 1065,215 Z" fill="url(#sweepGrad)"/>
      <line x1="920" y1="240" x2="1065" y2="215" stroke="#22D3EE" stroke-width="1.8" filter="url(#glow)"/>
    </g>

    <!-- Target Reticle -->
    <g transform="translate(920, 240)" stroke="#38BDF8" stroke-width="1" opacity="0.65">
      <circle cx="0" cy="0" r="170" fill="none" stroke-dasharray="4, 8"/>
      <line x1="-185" y1="0" x2="-155" y2="0" stroke-width="2"/>
      <line x1="155" y1="0" x2="185" y2="0" stroke-width="2"/>
      <line x1="0" y1="-185" x2="0" y2="-155" stroke-width="2"/>
      <line x1="0" y1="155" x2="0" y2="185" stroke-width="2"/>
    </g>
    <rect x="815" y="415" width="210" height="22" rx="4" fill="#020617" stroke="#1E293B" opacity="0.9"/>
    <text x="920" y="430" text-anchor="middle" fill="#38BDF8" font-size="9.5" font-weight="bold" class="code-font">
      COORD: 12.9716° N, 77.5946° E [MGRS 43P FS]
    </text>
  </g>

  <!-- Left Branding & Badges -->
  <g transform="translate(70, 75)" class="float-ui">
    <rect x="0" y="0" width="285" height="24" rx="5" fill="#0B132B" stroke="#0284C7" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#06B6D4" class="blink-dot"/>
    <text x="24" y="16" fill="#38BDF8" font-size="10" font-weight="bold" class="code-font">
      SMART INDIA HACKATHON 2026 // SIH26167
    </text>

    <text x="0" y="72" fill="#FFFFFF" font-size="46" font-weight="800" letter-spacing="1.5" class="heading-font">
      BHUVISION
    </text>
    <text x="285" y="72" fill="#38BDF8" font-size="46" font-weight="300" class="heading-font">
      // AI
    </text>

    <text x="0" y="102" fill="#94A3B8" font-size="14.5" font-weight="500" class="heading-font">
      Autonomous Multi-Agent Spatial Earth Intelligence Council
    </text>

    <line x1="0" y1="120" x2="520" y2="120" stroke="url(#cyanFade)" stroke-width="2"/>
    <text x="0" y="145" fill="#38BDF8" font-size="13" font-weight="700" font-style="italic" class="heading-font">
      &#8220;Ask the Earth. AI decides how to investigate it.&#8221;
    </text>

    <!-- Badges -->
    <g transform="translate(0, 175)">
      <g transform="translate(0, 0)">
        <rect width="155" height="42" rx="8" fill="#0A1428" stroke="#1E3A8A" stroke-width="1.2"/>
        <circle cx="16" cy="21" r="5" fill="#10B981"/>
        <text x="28" y="17" fill="#FFFFFF" font-size="10" font-weight="bold" class="heading-font">9 Specialist Agents</text>
        <text x="28" y="32" fill="#64748B" font-size="8.5" class="code-font">Graph-of-Thought</text>
      </g>
      <g transform="translate(165, 0)">
        <rect width="155" height="42" rx="8" fill="#110E26" stroke="#581C87" stroke-width="1.2"/>
        <circle cx="16" cy="21" r="5" fill="#A855F7"/>
        <text x="28" y="17" fill="#FFFFFF" font-size="10" font-weight="bold" class="heading-font">SAR C-Band Radar</text>
        <text x="28" y="32" fill="#64748B" font-size="8.5" class="code-font">Lee Filter + Sigma-0</text>
      </g>
      <g transform="translate(330, 0)">
        <rect width="155" height="42" rx="8" fill="#051824" stroke="#0E7490" stroke-width="1.2"/>
        <circle cx="16" cy="21" r="5" fill="#06B6D4"/>
        <text x="28" y="17" fill="#FFFFFF" font-size="10" font-weight="bold" class="heading-font">Three.js WebGL</text>
        <text x="28" y="32" fill="#64748B" font-size="8.5" class="code-font">God's Eye View</text>
      </g>
    </g>

    <!-- Telemetry Strip -->
    <g transform="translate(0, 240)">
      <rect width="485" height="34" rx="6" fill="#030712" stroke="#1E293B" stroke-width="1"/>
      <text x="16" y="21" fill="#10B981" font-size="9" font-weight="bold" class="code-font">● REPO: ONLINE</text>
      <text x="115" y="21" fill="#64748B" font-size="9" class="code-font">|</text>
      <text x="130" y="21" fill="#38BDF8" font-size="9" font-weight="bold" class="code-font">ORGANIZATION: ISRO</text>
      <text x="265" y="21" fill="#64748B" font-size="9" class="code-font">|</text>
      <text x="280" y="21" fill="#F59E0B" font-size="9" font-weight="bold" class="code-font">TEAM: BANKAI</text>
      <text x="375" y="21" fill="#64748B" font-size="9" class="code-font">|</text>
      <text x="390" y="21" fill="#A855F7" font-size="9" font-weight="bold" class="code-font">ZERO-KEY: READY</text>
    </g>
  </g>
</svg>